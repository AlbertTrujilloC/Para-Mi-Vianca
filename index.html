<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Vianca 🌻</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 30%, #fff8d6 0%, #ffe98a 45%, #f7c948 100%);
    font-family: 'Georgia', serif;
    overflow: hidden;
    position: relative;
    padding: 20px;
  }

  /* Pétalos cayendo */
  .petalo {
    position: fixed;
    top: -40px;
    font-size: 24px;
    animation: caer linear infinite;
    pointer-events: none;
    opacity: 0.85;
    z-index: 1;
  }
  @keyframes caer {
    0%   { transform: translateY(-40px) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.9; }
    100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
  }

  /* Tarjeta principal */
  .tarjeta {
    position: relative;
    z-index: 10;
    max-width: 520px;
    width: 100%;
    background: rgba(255, 255, 255, 0.92);
    border-radius: 24px;
    padding: 45px 35px;
    text-align: center;
    box-shadow: 0 25px 60px rgba(180, 120, 0, 0.35);
    border: 2px solid #f7c948;
    opacity: 0;
    transform: scale(0.85) translateY(20px);
    animation: aparecer 1.4s ease-out 0.4s forwards;
  }
  @keyframes aparecer {
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* Ramo de flores SVG */
  .ramo {
    width: 190px;
    height: 190px;
    margin: 0 auto 18px;
    opacity: 0;
    transform: scale(0.3) rotate(-25deg);
    animation: brotar 1.6s cubic-bezier(.34,1.56,.64,1) 1s forwards;
  }
  @keyframes brotar {
    to { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  .nombre {
    font-size: 2.2rem;
    color: #b8860b;
    letter-spacing: 1px;
    margin-bottom: 6px;
    font-weight: normal;
  }

  .de {
    font-size: 1.05rem;
    color: #9c7a1f;
    font-style: italic;
    margin-bottom: 22px;
  }

  .mensaje {
    font-size: 1.15rem;
    color: #6b5210;
    line-height: 1.7;
    margin-bottom: 28px;
    padding: 0 6px;
  }

  .firma {
    font-size: 1rem;
    color: #b8860b;
    font-style: italic;
    border-top: 1px dashed #e6c452;
    padding-top: 18px;
  }

  /* Corazón latiendo */
  .corazon {
    font-size: 1.6rem;
    margin-top: 14px;
    display: inline-block;
    animation: latir 1.4s ease-in-out infinite;
  }
  @keyframes latir {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.25); }
  }

  @media (max-width: 480px) {
    .tarjeta { padding: 32px 22px; }
    .nombre  { font-size: 1.8rem; }
    .ramo    { width: 150px; height: 150px; }
    .mensaje { font-size: 1.02rem; }
  }
</style>
</head>
<body>

  <!-- Ramo de girasoles dibujado en SVG -->
  <div class="tarjeta">
    <svg class="ramo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <!-- Tallos -->
      <path d="M100 195 Q95 150 85 110" stroke="#3d7a2e" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M100 195 Q105 150 115 110" stroke="#3d7a2e" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M100 195 Q100 155 100 120" stroke="#3d7a2e" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- Hojas -->
      <ellipse cx="80" cy="150" rx="18" ry="8" fill="#4c9c39" transform="rotate(-30 80 150)"/>
      <ellipse cx="122" cy="155" rx="18" ry="8" fill="#4c9c39" transform="rotate(30 122 155)"/>
      <ellipse cx="100" cy="170" rx="16" ry="7" fill="#3d7a2e" transform="rotate(0 100 170)"/>

      <!-- Girasol central -->
      <g>
        <ellipse cx="100" cy="85" rx="10" ry="26" fill="#ffd93b" transform="rotate(0 100 85)"/>
        <ellipse cx="100" cy="85" rx="10" ry="26" fill="#ffd93b" transform="rotate(45 100 85)"/>
        <ellipse cx="100" cy="85" rx="10" ry="26" fill="#ffd93b" transform="rotate(90 100 85)"/>
        <ellipse cx="100" cy="85" rx="10" ry="26" fill="#ffd93b" transform="rotate(135 100 85)"/>
        <circle cx="100" cy="85" r="18" fill="#8b5a2b"/>
        <circle cx="100" cy="85" r="12" fill="#6b4220"/>
      </g>

      <!-- Girasol izquierdo -->
      <g>
        <ellipse cx="62" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(0 62 95)"/>
        <ellipse cx="62" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(45 62 95)"/>
        <ellipse cx="62" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(90 62 95)"/>
        <ellipse cx="62" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(135 62 95)"/>
        <circle cx="62" cy="95" r="14" fill="#8b5a2b"/>
      </g>

      <!-- Girasol derecho -->
      <g>
        <ellipse cx="138" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(0 138 95)"/>
        <ellipse cx="138" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(45 138 95)"/>
        <ellipse cx="138" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(90 138 95)"/>
        <ellipse cx="138" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(135 138 95)"/>
        <circle cx="138" cy="95" r="14" fill="#8b5a2b"/>
      </g>
    </svg>

    <h1 class="nombre">Vianca Ruiz Flores</h1>
    <p class="de">De: Alguien que te quiere demasiado</p>

    <p class="mensaje">
      Siento que es lo mínimo que puedo hacer…<br>
      pero cada flor de este ramo lleva un pedacito de lo mucho que significas para mí. 🌻
    </p>

    <p class="firma">Con todo mi cariño 💛</p>
    <div class="corazon">💛</div>
  </div>

<script>
  // Genera pétalos/flores cayendo
  const flores = ['🌻', '🌼', '💛', '🌻', '✨'];
  function crearPetalo() {
    const p = document.createElement('div');
    p.className = 'petalo';
    p.textContent = flores[Math.floor(Math.random() * flores.length)];
    p.style.left = Math.random() * 100 + 'vw';
    p.style.fontSize = (14 + Math.random() * 18) + 'px';
    p.style.animationDuration = (6 + Math.random() * 6) + 's';
    p.style.animationDelay = Math.random() * 4 + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 16000);
  }
  for (let i = 0; i < 18; i++) crearPetalo();
  setInterval(crearPetalo, 900);
</script>

</body>
</html>
