<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una sorpresa para ti 🌻</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    font-family: 'Georgia', serif;
    overflow: hidden;
    background: #0a0806;
    color: #ffe98a;
  }

  /* ============ FONDO GENERAL (dorado oscuro) ============ */
  .fondo {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, #1a1305 0%, #050402 80%);
    z-index: 0;
    transition: opacity 1.2s ease;
  }

  /* Resplandor dorado pulsante */
  .fondo::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(255, 210, 60, 0.15) 0%, transparent 60%);
    animation: respirar 6s ease-in-out infinite;
  }
  @keyframes respirar {
    0%, 100% { opacity: 0.5; }
    50%      { opacity: 1; }
  }

  /* ============ PÉTALOS GRANDES CAYENDO ============ */
  .petalo {
    position: fixed;
    top: -80px;
    z-index: 1;
    pointer-events: none;
    animation: caer linear infinite;
    filter: drop-shadow(0 0 12px rgba(255, 210, 60, 0.6));
  }
  @keyframes caer {
    0%   { transform: translateY(-80px) rotate(0deg); opacity: 0; }
    8%   { opacity: 0.9; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  /* ============ PANTALLA 1: INTRO ============ */
  .pantalla {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 20px;
    text-align: center;
    transition: opacity 1.2s ease, visibility 1.2s ease;
  }

  .pantalla.oculta {
    opacity: 0;
    visibility: hidden;
  }

  .intro-linea {
    font-size: clamp(1.6rem, 5vw, 2.6rem);
    color: #ffe98a;
    letter-spacing: 1px;
    text-shadow: 0 0 20px rgba(255, 210, 60, 0.7);
    margin: 12px 0;
    min-height: 1.2em;
    opacity: 0;
  }

  .intro-linea.visible {
    animation: aparecerTexto 0.9s ease-out forwards;
  }
  @keyframes aparecerTexto {
    from { opacity: 0; transform: translateY(15px); filter: blur(6px); }
    to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
  }

  /* Cursor tipo máquina de escribir */
  .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: #ffe98a;
    margin-left: 4px;
    vertical-align: middle;
    animation: parpadeo 0.8s steps(1) infinite;
  }
  @keyframes parpadeo { 50% { opacity: 0; } }

  /* Botón "Sí, estoy lista" */
  .btn-lista {
    margin-top: 45px;
    padding: 16px 42px;
    font-size: 1.15rem;
    font-family: inherit;
    color: #fff3b0;
    background: transparent;
    border: 2px solid #ffd93b;
    border-radius: 50px;
    cursor: pointer;
    letter-spacing: 1px;
    position: relative;
    opacity: 0;
    transition: all 0.4s ease;
    box-shadow: 0 0 20px rgba(255, 210, 60, 0.4);
  }
  .btn-lista.visible {
    opacity: 1;
    animation: latirBoton 2s ease-in-out infinite;
  }
  .btn-lista:hover {
    background: #ffd93b;
    color: #1a1305;
    box-shadow: 0 0 40px rgba(255, 210, 60, 0.9);
    transform: scale(1.05);
  }
  @keyframes latirBoton {
    0%, 100% { box-shadow: 0 0 20px rgba(255, 210, 60, 0.4); }
    50%      { box-shadow: 0 0 40px rgba(255, 210, 60, 0.9); }
  }

  /* ============ PANTALLA 2: EXPLOSIÓN DE RAMOS ============ */
  #explosion {
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    overflow: hidden;
    display: none;
  }

  .ramo-volador {
    position: absolute;
    opacity: 0;
    animation: brotarRamo 2.5s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes brotarRamo {
    0%   { opacity: 0; transform: scale(0) rotate(-90deg); }
    40%  { opacity: 1; transform: scale(1.1) rotate(10deg); }
    70%  { opacity: 1; transform: scale(1) rotate(0deg); }
    100% { opacity: 0.9; transform: scale(1.15) rotate(-5deg); }
  }

  /* ============ PANTALLA 3: TARJETA FINAL ============ */
  #final {
    display: none;
    z-index: 30;
  }
  #final.activo {
    display: flex;
    animation: aparecerFinal 1.5s ease-out forwards;
  }
  @keyframes aparecerFinal {
    from { opacity: 0; transform: scale(0.9); }
    to   { opacity: 1; transform: scale(1); }
  }

  .tarjeta {
    max-width: 560px;
    width: 100%;
    background: linear-gradient(160deg, #1a1305 0%, #2b1e08 100%);
    border-radius: 28px;
    padding: 50px 38px;
    text-align: center;
    border: 2px solid #ffd93b;
    box-shadow:
      0 0 60px rgba(255, 210, 60, 0.5),
      inset 0 0 40px rgba(255, 210, 60, 0.08);
    position: relative;
  }

  /* Borde brillante animado */
  .tarjeta::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 30px;
    background: linear-gradient(45deg, #ffd93b, transparent, #ffd93b, transparent);
    background-size: 300% 300%;
    z-index: -1;
    animation: bordeGirar 6s linear infinite;
    filter: blur(8px);
    opacity: 0.6;
  }
  @keyframes bordeGirar {
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  .ramo-central {
    width: 220px;
    height: 220px;
    margin: 0 auto 20px;
    filter: drop-shadow(0 0 25px rgba(255, 210, 60, 0.6));
    animation: flotarRamo 4s ease-in-out infinite;
  }
  @keyframes flotarRamo {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50%      { transform: translateY(-12px) rotate(2deg); }
  }

  .nombre {
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    color: #ffd93b;
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(255, 210, 60, 0.8);
    font-weight: normal;
  }

  .de {
    font-size: 1rem;
    color: #d4b45a;
    font-style: italic;
    margin-bottom: 26px;
    letter-spacing: 1px;
  }

  .mensaje {
    font-size: 1.15rem;
    color: #ffe98a;
    line-height: 1.8;
    margin-bottom: 30px;
    padding: 0 8px;
  }

  .firma {
    font-size: 1rem;
    color: #ffd93b;
    font-style: italic;
    border-top: 1px dashed rgba(255, 217, 59, 0.5);
    padding-top: 20px;
    letter-spacing: 1px;
  }

  .corazon {
    font-size: 1.8rem;
    margin-top: 16px;
    display: inline-block;
    animation: latir 1.4s ease-in-out infinite;
    filter: drop-shadow(0 0 12px rgba(255, 210, 60, 0.9));
  }
  @keyframes latir {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.3); }
  }

  @media (max-width: 480px) {
    .tarjeta { padding: 32px 22px; }
    .ramo-central { width: 160px; height: 160px; }
    .mensaje { font-size: 1rem; }
  }
</style>
</head>
<body>

  <div class="fondo"></div>

  <!-- ============ PANTALLA 1: INTRO ============ -->
  <div class="pantalla" id="intro">
    <p class="intro-linea" id="linea1"></p>
    <p class="intro-linea" id="linea2"></p>
    <button class="btn-lista" id="btnLista">¿Estás lista? 💛</button>
  </div>

  <!-- ============ PANTALLA 2: EXPLOSIÓN DE RAMOS ============ -->
  <div id="explosion"></div>

  <!-- ============ PANTALLA 3: TARJETA FINAL ============ -->
  <div class="pantalla" id="final">
    <div class="tarjeta">
      <svg class="ramo-central" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Tallos -->
        <path d="M100 195 Q95 150 85 110" stroke="#3d7a2e" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M100 195 Q105 150 115 110" stroke="#3d7a2e" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M100 195 Q100 155 100 120" stroke="#3d7a2e" stroke-width="5" fill="none" stroke-linecap="round"/>
        <!-- Hojas -->
        <ellipse cx="80" cy="150" rx="18" ry="8" fill="#4c9c39" transform="rotate(-30 80 150)"/>
        <ellipse cx="122" cy="155" rx="18" ry="8" fill="#4c9c39" transform="rotate(30 122 155)"/>
        <ellipse cx="100" cy="170" rx="16" ry="7" fill="#3d7a2e" transform="rotate(0 100 170)"/>
        <!-- Girasol central -->
        <g>
          <ellipse cx="100" cy="85" rx="10" ry="26" fill="#ffd93b" transform="rotate(0 100 85)"/>
          <ellipse cx="100" cy="85" rx="10" ry="26" fill="#ffd93b" transform="rotate(45 100 85)"/>
          <ellipse cx="100" cy="85" rx="10" ry="26" fill="#ffd93b" transform="rotate(90 100 85)"/>
          <ellipse cx="100" cy="85" rx="10" ry="26" fill="#ffd93b" transform="rotate(135 100 85)"/>
          <circle cx="100" cy="85" r="18" fill="#8b5a2b"/>
          <circle cx="100" cy="85" r="12" fill="#6b4220"/>
        </g>
        <!-- Girasol izquierdo -->
        <g>
          <ellipse cx="62" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(0 62 95)"/>
          <ellipse cx="62" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(45 62 95)"/>
          <ellipse cx="62" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(90 62 95)"/>
          <ellipse cx="62" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(135 62 95)"/>
          <circle cx="62" cy="95" r="14" fill="#8b5a2b"/>
        </g>
        <!-- Girasol derecho -->
        <g>
          <ellipse cx="138" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(0 138 95)"/>
          <ellipse cx="138" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(45 138 95)"/>
          <ellipse cx="138" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(90 138 95)"/>
          <ellipse cx="138" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(135 138 95)"/>
          <circle cx="138" cy="95" r="14" fill="#8b5a2b"/>
        </g>
      </svg>

      <h1 class="nombre">Vianca Ruiz Flores</h1>
      <p class="de">De: Alguien que te quiere demasiado</p>

      <p class="mensaje">
        Siento que es lo mínimo que puedo hacer…<br>
        pero cada flor de este ramo lleva un pedacito de lo mucho que significas para mí. 🌻
      </p>

      <p class="firma">Con todo mi cariño 💛</p>
      <div class="corazon">💛</div>
    </div>
  </div>

  <!-- Audio -->
  <audio id="musica" src="https://albertrujilloc.github.io/Para-Mi-Vianca/musica.mp3" loop></audio>

<script>
  /* ================= PÉTALOS GRANDES CAYENDO ================= */
  const simbolos = ['🌻', '🌼', '💛', '✨'];
  function crearPetalo() {
    const p = document.createElement('div');
    p.className = 'petalo';
    p.textContent = simbolos[Math.floor(Math.random() * simbolos.length)];
    p.style.left = Math.random() * 100 + 'vw';
    p.style.fontSize = (40 + Math.random() * 50) + 'px';  // GRANDES
    p.style.animationDuration = (7 + Math.random() * 6) + 's';
    p.style.animationDelay = Math.random() * 5 + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 18000);
  }
  for (let i = 0; i < 12; i++) crearPetalo();
  setInterval(crearPetalo, 1200);

  /* ================= INTRO CON EFECTO ESCRITURA ================= */
  const linea1 = document.getElementById('linea1');
  const linea2 = document.getElementById('linea2');
  const btnLista = document.getElementById('btnLista');

  function escribir(elemento, texto, velocidad, callback) {
    let i = 0;
    elemento.classList.add('visible');
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    elemento.appendChild(cursor);

    function tick() {
      if (i < texto.length) {
        cursor.insertAdjacentText('beforebegin', texto.charAt(i));
        i++;
        setTimeout(tick, velocidad);
      } else {
        setTimeout(() => {
          cursor.remove();
          if (callback) callback();
        }, 500);
      }
    }
    tick();
  }

  // Secuencia de la intro
  setTimeout(() => {
    escribir(linea1, 'Hola...', 120, () => {
      setTimeout(() => {
        escribir(linea2, 'te tengo una sorpresa 🌻', 90, () => {
          setTimeout(() => btnLista.classList.add('visible'), 400);
        });
      }, 800);
    });
  }, 800);

  /* ================= CLIC EN "¿ESTÁS LISTA?" ================= */
  const musica = document.getElementById('musica');
  const intro = document.getElementById('intro');
  const explosion = document.getElementById('explosion');
  const final = document.getElementById('final');

  btnLista.addEventListener('click', () => {
    // Música
    musica.volume = 0.6;
    musica.play().catch(() => {});

    // Ocultar intro
    intro.classList.add('oculta');

    // Mostrar explosión de ramos
    explosion.style.display = 'block';
    generarExplosion();

    // Después de 3s, mostrar la tarjeta final
    setTimeout(() => {
      explosion.style.opacity = '0';
      explosion.style.transition = 'opacity 1.2s ease';
      final.style.display = 'flex';
      final.style.opacity = '1';
    }, 3000);
  });

  /* ================= GENERAR EXPLOSIÓN DE RAMOS ================= */
  function generarExplosion() {
    const ramoSVG = `
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
        <path d="M100 195 Q95 150 85 110" stroke="#3d7a2e" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M100 195 Q105 150 115 110" stroke="#3d7a2e" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M100 195 Q100 155 100 120" stroke="#3d7a2e" stroke-width="5" fill="none" stroke-linecap="round"/>
        <ellipse cx="80" cy="150" rx="18" ry="8" fill="#4c9c39" transform="rotate(-30 80 150)"/>
        <ellipse cx="122" cy="155" rx="18" ry="8" fill="#4c9c39" transform="rotate(30 122 155)"/>
        <ellipse cx="100" cy="170" rx="16" ry="7" fill="#3d7a2e"/>
        <g>
          <ellipse cx="100" cy="85" rx="10" ry="26" fill="#ffd93b"/>
          <ellipse cx="100" cy="85" rx="10" ry="26" fill="#ffd93b" transform="rotate(45 100 85)"/>
          <ellipse cx="100" cy="85" rx="10" ry="26" fill="#ffd93b" transform="rotate(90 100 85)"/>
          <ellipse cx="100" cy="85" rx="10" ry="26" fill="#ffd93b" transform="rotate(135 100 85)"/>
          <circle cx="100" cy="85" r="18" fill="#8b5a2b"/>
          <circle cx="100" cy="85" r="12" fill="#6b4220"/>
        </g>
        <g>
          <ellipse cx="62" cy="95" rx="8" ry="20" fill="#ffe14d"/>
          <ellipse cx="62" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(45 62 95)"/>
          <ellipse cx="62" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(90 62 95)"/>
          <ellipse cx="62" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(135 62 95)"/>
          <circle cx="62" cy="95" r="14" fill="#8b5a2b"/>
        </g>
        <g>
          <ellipse cx="138" cy="95" rx="8" ry="20" fill="#ffe14d"/>
          <ellipse cx="138" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(45 138 95)"/>
          <ellipse cx="138" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(90 138 95)"/>
          <ellipse cx="138" cy="95" rx="8" ry="20" fill="#ffe14d" transform="rotate(135 138 95)"/>
          <circle cx="138" cy="95" r="14" fill="#8b5a2b"/>
        </g>
      </svg>`;

    // Crear 24 ramos volando desde distintas posiciones
    for (let i = 0; i < 24; i++) {
      const ramo = document.createElement('div');
      ramo.className = 'ramo-volador';
      ramo.innerHTML = ramoSVG;

      const tamano = 90 + Math.random() * 160; // entre 90 y 250px
      ramo.style.width  = tamano + 'px';
      ramo.style.height = tamano + 'px';
      ramo.style.left = (Math.random() * 85) + 'vw';
      ramo.style.top  = (Math.random() * 80) + 'vh';
      ramo.style.animationDelay = (Math.random() * 1.2) + 's';
      ramo.style.filter = 'drop-shadow(0 0 25px rgba(255, 210, 60, 0.9))';

      explosion.appendChild(ramo);
    }
  }
</script>

</body>
</html>
